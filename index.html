<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, og:* and <html lang> are updated at runtime by src/i18n/I18nProvider.tsx -->
    <title>EuroCargo — Transporte pela Europa</title>
    <meta
      name="description"
      content="Peças automóveis novas e usadas, transporte e rastreamento de encomendas entre Portugal, Espanha e o resto da Europa."
    />
    <meta name="theme-color" content="#0b2a5b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EuroCargo" />
    <meta property="og:title" content="EuroCargo — Transporte pela Europa" />
    <meta
      property="og:description"
      content="Peças automóveis novas e usadas, transporte e rastreamento de encomendas entre Portugal, Espanha e o resto da Europa."
    />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="it_IT" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
